<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Admin</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./firebase-config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="login-panel" id="admin-login-panel" aria-labelledby="admin-login-title">
        <h1 id="admin-login-title">Admin Login</h1>
        <form class="login-form" id="admin-login-form">
          <label>
            Passcode
            <input id="admin-password-input" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Sign In</button>
        </form>
        <p class="status-line" id="admin-login-status" role="status" aria-live="polite"></p>
      </section>

      <section class="admin-dashboard" id="admin-dashboard" hidden>
        <header class="app-header">
          <div>
            <h1>Attendance Admin</h1>
            <p id="admin-current-day">Saturday</p>
          </div>
          <button class="secondary-button" id="admin-logout-button" type="button">Sign Out</button>
        </header>

        <section class="admin-grid">
          <section class="admin-card" aria-labelledby="employee-admin-title">
            <div class="section-header">
              <h2 id="employee-admin-title">Employee Details</h2>
            </div>
            <form class="config-form" id="employee-config-form">
              <label>
                Employee ID
                <input id="employee-id-input" name="employeeId" required placeholder="EMP004" />
              </label>
              <label>
                Name
                <input id="employee-name-input" name="employeeName" required placeholder="Employee name" />
              </label>
              <button type="submit">Save Employee</button>
            </form>
            <div class="table-wrap compact">
              <table id="employee-table"></table>
            </div>
          </section>

          <section class="admin-card" aria-labelledby="office-admin-title">
            <div class="section-header">
              <h2 id="office-admin-title">Office Locations</h2>
              <span class="radius-note">200 m radius</span>
            </div>
            <form class="config-form" id="office-config-form">
              <label>
                Office ID
                <input id="office-id-input" name="officeId" required placeholder="BLR001" />
              </label>
              <label>
                Office Name
                <input id="office-name-input" name="officeName" required placeholder="Bangalore Office" />
              </label>
              <label>
                Latitude
                <input id="office-latitude-input" name="latitude" required type="number" step="0.000001" placeholder="12.971600" />
              </label>
              <label>
                Longitude
                <input id="office-longitude-input" name="longitude" required type="number" step="0.000001" placeholder="77.594600" />
              </label>
              <button type="submit">Save Office</button>
            </form>
            <div class="table-wrap compact">
              <table id="office-table"></table>
            </div>
          </section>

          <section class="admin-card reports-card" aria-labelledby="reports-title">
            <div class="section-header">
              <h2 id="reports-title">Reports</h2>
              <div class="report-actions">
                <div class="tabs" role="tablist" aria-label="Attendance reports">
                  <button class="tab is-active" type="button" data-report="daily">Daily</button>
                  <button class="tab" type="button" data-report="weekly">Weekly</button>
                  <button class="tab" type="button" data-report="monthly">Monthly</button>
                </div>
                <button class="secondary-button" id="download-report-button" type="button">Download CSV</button>
              </div>
            </div>
            <div class="table-wrap">
              <table id="report-table"></table>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script type="module" src="./admin.js?v=20260808-admin-login"></script>
  </body>
</html>
