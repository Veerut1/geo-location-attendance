name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html admin.html styles.css firebase-config.js attendance-data.js employee.js admin.js public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./public
          commit_message: 'Deploy Geo Location Attendance to GitHub Pages'
          keep_files: true
